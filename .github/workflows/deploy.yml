name: deploy

on:
  push:
    branches: [backend/2.6]
  workflow_dispatch:
    inputs:
      branch:
        description: '自动部署分支'
        required: true
        default: main

env:
  JDK_VERSION: '21'
  NODE_VERSION: '24'
  BACKEND_DIR: backend/aI-assistant-server
  WEB_DIR: frontend/web

# 所有Job的容器
jobs:
  # Job的id，自定义
  deploy:
    # 申请一台全新的Ubuntu虚拟机
    runs-on: ubuntu-latest
    # 步骤列表，从上往下
    steps:
      # 全新虚拟机是空的，先拉取代码
      - uses: actions/checkout@v4
      # 在虚拟机上安装JDK
      - uses: actions/setup-java@v4
        # with是参数
        with:
          # JDK 发行版（Eclipse 基金会的，社区标准）
          distribution: temurin
          java-version: ${{env.JDK_VERSION}}
          # 缓存 ~/.m2 依赖目录：第一次构建按 pom.xml
          cache: maven
      - name: Maven package
        # 相当于先 cd 到后端模块目录
        working-directory: ${{ env.BACKEND_DIR }}
        # -B 批处理模式（日志干净），跳过测试
        run: mvn -B -DskipTests package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: npm ci

      - name: Vite build
        working-directory: ${{ env.WEB_DIR }}
        run: npm run build

      # ① dist 里小文件多，先压成一个包，传输快
      - name: Package frontend dist
        working-directory: ${{env.WEB_DIR}}
        run: tar -czf dist.tar.gz dist
      # ② 装钥匙：私钥从保险柜倒成文件（放到默认路径，ssh/scp 自动捡），
      # 再把服务器指纹登记进信任名单（否则 ssh 会卡在 yes/no 提问）
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      # ③ 传后端 jar，直接覆盖服务器上的 app.jar
      - name: Upload backend jar
        run: scp ${{ env.BACKEND_DIR }}/target/*.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/root/smart-language-classroom/backend/app.jar
      # ④ 传前端压缩包
      - name: Upload frontend package
        run: scp ${{ env.WEB_DIR }}/dist.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/root/smart-language-classroom/frontend/
      # ⑤ 双引号里的命令在【服务器上】执行：解包、清包、重建镜像并重启容器
      - name: Deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd /root/smart-language-classroom/frontend &&
            rm -rf dist &&
            tar -xzf dist.tar.gz &&
            rm dist.tar.gz &&
            cd /root/smart-language-classroom &&
            docker compose up -d --build
          "
