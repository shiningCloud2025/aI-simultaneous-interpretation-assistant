<!DOCTYPE html>
<html lang="zh-CN" data-mode="star" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智语同航 · 超管看板</title>
<style>
:root{
  --bg:#070b16; --bg2:#0c1322;
  --card:rgba(255,255,255,.045); --card-hi:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.09); --border-hi:rgba(255,255,255,.16);
  --txt:#e8edfa; --txt2:#9aa5c0; --txt3:#616d8a;
  --c-user:#3ddc97;      /* 用户看板 - 青绿 */
  --c-ops:#ffb454;       /* 运营看板 - 琥珀 */
  --c-ai:#7b8cff;        /* AI 看板 - 蓝紫 */
  --c-dev:#ff6b8a;       /* 日志看板 - 玫红 */
  --gold:#ffd166;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt); font-size:13px; overflow:hidden;
  height:100%;-webkit-font-smoothing:antialiased;
}
.app{display:flex;height:100vh}

/* ══════════ 背景：极光 + 网格 ══════════ */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora{position:absolute;border-radius:50%;filter:blur(90px);opacity:.30;
  animation:drift 22s ease-in-out infinite alternate}
.a1{width:620px;height:620px;top:-14%;left:-8%;background:radial-gradient(circle,#1d5cff,transparent 68%)}
.a2{width:560px;height:560px;bottom:-16%;right:-6%;background:radial-gradient(circle,#00d2a8,transparent 68%)}
.a3{width:480px;height:480px;top:36%;left:44%;background:radial-gradient(circle,#8a4dff,transparent 68%);animation-delay:-8s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,-38px) scale(1.14)}}
.grid{position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 25%,transparent 78%)}
#stars{position:absolute;inset:0}
#stars i{position:absolute;background:#fff;border-radius:50%;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.85}}

/* ══════════ 经典模式：侧边栏 ══════════ */
.sidebar{
  width:210px;flex-shrink:0;z-index:2;
  background:rgba(255,255,255,.028);backdrop-filter:blur(16px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 12px;
}
body[data-mode="classic"] .sidebar{display:flex}
body[data-mode="star"] .sidebar{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px}
.logo{width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--c-user),var(--c-ai));
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#071018}
.brand b{font-size:14px;letter-spacing:.4px}
.brand small{display:block;font-size:10px;color:var(--txt3);font-weight:400}
.grp{font-size:10px;color:var(--txt3);padding:0 8px;margin:14px 0 6px;letter-spacing:1px}
.grp:first-of-type{margin-top:0}
.nav{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;cursor:pointer;
  color:var(--txt2);font-size:13px;margin-bottom:2px;border:none;background:none;
  font-family:inherit;width:100%;text-align:left;transition:.16s;position:relative}
.nav:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.nav.active{color:#fff;font-weight:600}
.nav.active:before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--nc,var(--c-user));
  box-shadow:0 0 10px var(--nc,var(--c-user))}
.nav .ic{font-size:14px}
.nav .tag{margin-left:auto;font-size:9px;padding:1px 6px;border-radius:5px;
  background:rgba(255,255,255,.08);color:var(--txt3)}

/* ══════════ 星空模式 ══════════ */
.starfield{
  position:fixed;inset:0;z-index:40;display:none;
}
body[data-mode="star"] .starfield{display:block}
.orbit-wrap{position:absolute;top:50%;left:50%;width:0;height:0}
.orbit{position:absolute;top:50%;left:50%;border-radius:50%;
  border:1px solid rgba(255,255,255,.055);transform:translate(-50%,-50%)}
.planet{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;
  animation:spinrev 80s linear infinite}
@keyframes spinrev{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
.orbit.spin{animation:spin 80s linear infinite}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}
  to{transform:translate(-50%,-50%) rotate(360deg)}}
.pbody{
  width:104px;height:104px;border-radius:50%;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:radial-gradient(circle at 33% 26%,var(--pb2),var(--pb1) 62%,#0a1020 100%);
  border:1px solid rgba(255,255,255,.14);
  transition:transform .3s cubic-bezier(.34,1.5,.64,1),box-shadow .3s;
}
.pbody:hover{transform:scale(1.14);box-shadow:0 0 44px var(--pg),0 0 90px var(--pg2)}
.pbody .pi{font-size:26px;line-height:1;filter:drop-shadow(0 0 8px var(--pg))}
.pbody .pl{font-size:12px;font-weight:600;letter-spacing:.5px}
.pbody .pd{font-size:9px;color:rgba(255,255,255,.5);letter-spacing:.3px}
.sf-top{position:absolute;top:0;left:0;right:0;padding:26px 32px;
  display:flex;justify-content:space-between;align-items:flex-start;z-index:3}
.sf-t b{display:block;font-size:20px;letter-spacing:1.4px;font-weight:600;
  background:linear-gradient(92deg,#fff,#9fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sf-t span{font-size:11px;color:var(--txt3);letter-spacing:.6px}
.sf-hint{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:11px;color:var(--txt3);letter-spacing:.8px}

/* ══════════ 主区 ══════════ */
.main{flex:1;display:flex;flex-direction:column;z-index:2;position:relative;overflow:hidden}
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.022);backdrop-filter:blur(14px)}
body[data-mode="star"] .topbar{display:none}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-l h1{font-size:16px;font-weight:600}
.tb-l .dot{width:8px;height:8px;border-radius:50%;background:var(--nc);box-shadow:0 0 10px var(--nc)}
.tb-r{display:flex;gap:8px;align-items:center}
.mbtn{padding:7px 15px;border-radius:9px;cursor:pointer;font:inherit;font-size:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--txt2);transition:.18s}
.mbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.mbtn.on{background:linear-gradient(92deg,var(--c-ai),var(--c-user));color:#07101a;border:none;font-weight:600}

/* 一屏式看板：整页严格锁定，永不出现页面级滚动；只有卡片内部可滚 */
.content{flex:1;display:flex;flex-direction:column;
  padding:18px 24px 22px;overflow:hidden;min-height:0}
.board{display:flex;flex-direction:column;gap:13px;flex:1;min-height:0}

/* ══════════ 看板面板（星空模式全屏） ══════════ */
.panel{display:none;animation:pin .42s cubic-bezier(.2,.9,.3,1)}
.panel.on{display:block}
@keyframes pin{from{opacity:0;transform:scale(.965) translateY(14px)}}
body[data-mode="star"] .panel.on{
  position:fixed;inset:0;z-index:45;overflow-y:auto;padding:0 0 40px;
  background:radial-gradient(ellipse at 50% 0%,rgba(20,30,60,.9),rgba(6,10,22,.97) 62%);
  backdrop-filter:blur(20px);animation:pinfly .5s cubic-bezier(.2,.9,.3,1)}
@keyframes pinfly{from{opacity:0;transform:scale(1.14)}}
body[data-mode="star"] .panel-inner{max-width:1560px;margin:0 auto;padding:26px 32px}

/* 用户看板：与 AI 看板一致，电脑 100% 缩放下一屏铺满 */
body[data-mode="star"] #panel-user.panel.on{overflow:hidden;padding:0}
body[data-mode="star"] #panel-user .panel-inner{
  max-width:none;width:100%;height:100vh;padding:8px 24px 18px;display:flex}
#panel-user .user-board{
  width:100%;height:100%;min-height:0;display:grid;gap:12px;
  grid-template-rows:58px 110px minmax(0,1.55fr) minmax(0,1.15fr)}
#panel-user .mb{margin-bottom:0}
#panel-user .sb-head{margin-bottom:0;align-items:center}
#panel-user .sb-head h1{font-size:24px}
#panel-user .sb-head .sub{margin-top:4px}
#panel-user .sb-stats{margin-bottom:0;gap:12px;min-height:0}
#panel-user .sb-stat{padding:14px 16px;border-radius:13px}
#panel-user .sb-stat .lb{font-size:11.5px;margin-bottom:9px}
#panel-user .sb-stat .vl{font-size:30px;letter-spacing:-.8px}
#panel-user .sb-stat .dl{margin-top:10px;font-size:11.5px}
#panel-user .sb-card{margin-bottom:0;padding:14px 16px;border-radius:13px;min-height:0;display:flex;flex-direction:column;overflow:auto}
#panel-user .sb-card::-webkit-scrollbar{width:6px;height:6px}
#panel-user .sb-card::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
#panel-user .sb-card h2{font-size:12px;margin-bottom:9px;flex-shrink:0}
#panel-user .sb-card h2 .hint{font-size:10.5px}
#panel-user .trend-tools input{height:26px;width:112px;font-size:10.5px}
#panel-user .trend-tools button{height:26px;font-size:10.5px;padding:0 9px}
#panel-user .sb-chart{height:auto;flex:1;min-height:0}
#panel-user .lg{margin-top:7px;font-size:10.5px!important;flex-shrink:0}
#panel-user .sb-pies{margin-bottom:0;gap:12px;min-height:0}
#panel-user .sb-piew{gap:12px;min-height:0;flex:1}
#panel-user .sb-pie{width:min(58px,12vh);height:min(58px,12vh)}
#panel-user .sb-pie-lg{gap:5px;font-size:10.8px;min-width:0}
#panel-user .sb-pie-lg .i{font-size:10.8px}
#panel-user .sb-pie-lg .d{width:7px;height:7px}
#panel-user .sb-pie-lg .vv{font-size:11px}
#panel-user .sb-pie-lg .pc{font-size:9.5px;width:38px}
#panel-user .sb-row2{gap:12px;min-height:0;grid-auto-rows:minmax(0,1fr)}
#panel-user .dist-card .dist-grid{gap:12px}
#panel-user .sb-tbl{font-size:11.5px}
#panel-user .sb-tbl th,#panel-user .sb-tbl td{padding:7px 9px}
#panel-user .sb-oh{margin-bottom:6px}
#panel-user .sb-oh .big{font-size:22px}
#panel-user .online-filters{margin-bottom:6px}
#panel-user .online-filters input,#panel-user .online-filters select{height:28px;font-size:11px}
#panel-user .sb-ol{min-height:0;overflow:auto}
#panel-user .sb-ol .r{font-size:11.5px;padding:5px 2px}

/* AI 看板：电脑 100% 缩放下一屏铺满，页面本身不滚动 */
body[data-mode="star"] #panel-ai.panel.on{overflow:hidden;padding:0}
body[data-mode="star"] #panel-ai .panel-inner{
  max-width:none;width:100%;height:100vh;padding:8px 24px 18px;display:flex}
#panel-ai .ai-board{
  width:100%;height:100%;min-height:0;display:grid;gap:12px;
  grid-template-rows:58px 110px minmax(0,1.42fr) minmax(0,1.04fr) minmax(0,.8fr) minmax(0,.8fr)}
#panel-ai .mb{margin-bottom:0}
#panel-ai .sb-head{margin-bottom:0;align-items:center}
#panel-ai .sb-head h1{font-size:24px}
#panel-ai .sb-head .sub{margin-top:4px}
#panel-ai .sb-stats{margin-bottom:0;gap:12px;min-height:0}
#panel-ai .sb-stat{padding:14px 16px;border-radius:13px}
#panel-ai .sb-stat .lb{font-size:11.5px;margin-bottom:9px}
#panel-ai .sb-stat .vl{font-size:30px;letter-spacing:-.8px}
#panel-ai .sb-stat .dl{margin-top:10px;font-size:11.5px}
#panel-ai .sb-card{margin-bottom:0;padding:14px 16px;border-radius:13px;min-height:0;display:flex;flex-direction:column;overflow:auto}
#panel-ai .sb-card::-webkit-scrollbar{width:6px;height:6px}
#panel-ai .sb-card::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
#panel-ai .sb-card h2{font-size:12px;margin-bottom:9px;flex-shrink:0}
#panel-ai .sb-card h2 .hint{font-size:10.5px}
#panel-ai .sb-chart{height:auto;flex:1;min-height:0}
#panel-ai .lg{margin-top:7px;font-size:10.5px;flex-shrink:0}
#panel-ai .sb-pies{margin-bottom:0;gap:12px;min-height:0}
#panel-ai .sb-piew{gap:16px;min-height:0;flex:1}
#panel-ai .sb-pie{width:min(78px,16vh);height:min(78px,16vh)}
#panel-ai .sb-pie-lg{gap:8px;font-size:11.5px;min-width:0}
#panel-ai .sb-pie-lg .i{font-size:11.5px}
#panel-ai .sb-pie-lg .vv{font-size:12px}
#panel-ai .sb-row2{gap:12px;min-height:0;grid-auto-rows:minmax(0,1fr)}
#panel-ai .bl .r{font-size:11px;min-height:0}
#panel-ai .sb-tbl{font-size:11.5px}
#panel-ai .sb-tbl th,#panel-ai .sb-tbl td{padding:7px 9px}

/* 日志看板：本期聚焦日志查看，后续监控能力可独立扩展 */
body[data-mode="star"] #panel-dev.panel.on{overflow:hidden;padding:0}
body[data-mode="star"] #panel-dev .panel-inner{
  max-width:none;width:100%;height:100vh;padding:8px 24px 18px;display:flex}
#panel-dev .dev-board{
  width:100%;height:100%;min-height:0;display:grid;gap:12px;
  grid-template-rows:58px 104px minmax(0,1fr)}
#panel-dev .sb-head{margin-bottom:0;align-items:center}
#panel-dev .sb-head h1{font-size:24px}
#panel-dev .sb-head .sub{margin-top:4px}
#panel-dev .sb-stats{margin-bottom:0;gap:12px;min-height:0;grid-template-columns:repeat(4,1fr)}
#panel-dev .sb-stat{padding:14px 16px;border-radius:13px}
#panel-dev .sb-stat .lb{font-size:11.5px;margin-bottom:9px}
#panel-dev .sb-stat .vl{font-size:30px;letter-spacing:-.8px}
#panel-dev .sb-stat .dl{margin-top:10px;font-size:11.5px}
#panel-dev .dev-log-layout{display:grid;grid-template-columns:1fr 360px;gap:12px;min-height:0}
#panel-dev .dev-log-layout>*{min-height:0}
.log-console{background:rgba(3,7,16,.62);border:1px solid var(--border);border-radius:13px;
  min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.log-toolbar{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.log-title{font-size:12px;font-weight:600;color:var(--txt);white-space:nowrap;margin-right:4px}
.log-input,.log-select{height:32px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.055);
  color:var(--txt);font:inherit;font-size:12px;padding:0 10px;outline:none}
.log-input{flex:1;min-width:0}
.log-select{width:128px}
.log-btn{height:32px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.07);
  color:var(--txt);font:inherit;font-size:12px;padding:0 12px}
.log-btn.primary{border-color:rgba(255,107,138,.35);background:rgba(255,107,138,.16);color:#ff91a8}
.log-body{flex:1;min-height:0;overflow:auto;padding:12px 14px;font-family:"SFMono-Regular",Consolas,monospace;
  font-size:12px;line-height:1.75;color:#cbd3e8}
.log-body::-webkit-scrollbar,.log-file-list::-webkit-scrollbar{width:6px;height:6px}
.log-body::-webkit-scrollbar-thumb,.log-file-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.log-line{white-space:pre-wrap;border-bottom:1px solid rgba(255,255,255,.035);padding:2px 0}
.log-line .time{color:#65708d}.log-line .lv-info{color:#7b8cff}.log-line .lv-warn{color:#ffb454}.log-line .lv-error{color:#ff6b8a}
.log-mark{color:#fff;background:rgba(255,180,84,.28);border-radius:4px;padding:0 3px}
.log-side{display:grid;grid-template-rows:minmax(0,1fr);gap:12px;min-height:0}
.log-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.log-card h2{font-size:12px;margin-bottom:10px}
.log-file-list{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.log-file{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.045);
  border:1px solid transparent;font-size:12px}
.log-file.on{border-color:rgba(255,107,138,.38);background:rgba(255,107,138,.12)}
.log-file .name{font-weight:600;color:var(--txt)}.log-file .size,.log-file .date{font-size:10.5px;color:var(--txt3)}

/* ══════════ 星空模式：全屏大屏看板（独立于经典模式，允许滚动） ══════════ */
.sb-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}
.sb-head h1{font-size:27px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
.sb-head .sub{font-size:12px;color:var(--txt3);margin-top:6px}
.sb-head .live{margin-left:auto;padding:5px 13px;border-radius:8px;font-size:10px;
  letter-spacing:.6px;background:rgba(61,220,151,.14);color:var(--c-user);font-weight:600}

/* 大指标卡 */
.sb-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:20px}
.sb-stat{background:var(--card);border:1px solid var(--border);border-radius:17px;
  padding:20px 22px;position:relative;overflow:hidden;transition:.2s}
.sb-stat:hover{border-color:var(--border-hi)}
.sb-stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--nc)}
.sb-stat .lb{font-size:12px;color:var(--txt2);margin-bottom:13px;display:flex;align-items:center;gap:7px}
.sb-stat .lb .ic{font-size:15px}
.sb-stat .vl{font-size:37px;font-weight:700;letter-spacing:-1.6px;line-height:1;
  font-variant-numeric:tabular-nums}
.sb-stat .dl{margin-top:13px;font-size:12px;color:var(--c-user)}
.sb-stat .dl.dim{color:var(--txt3)}

/* 大卡片 */
.sb-card{background:var(--card);border:1px solid var(--border);border-radius:17px;
  padding:20px 22px;margin-bottom:20px;position:relative;overflow:hidden}
.sb-card:before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--nc),transparent);opacity:.5}
.sb-card h2{font-size:14px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.sb-card h2 .hint{font-size:11.5px;color:var(--txt3);font-weight:400}
.trend-tools{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px}
.trend-tools input{height:28px;width:124px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.055);color:var(--txt);font:inherit;font-size:11px;padding:0 8px;outline:none}
.trend-tools button{height:28px;border-radius:8px;border:1px solid rgba(61,220,151,.35);
  background:rgba(61,220,151,.14);color:#6ee7b7;font:inherit;font-size:11px;padding:0 10px;cursor:pointer}

/* 大趋势图 */
.sb-chart{height:290px;position:relative}
.sb-chart svg{width:100%;height:100%;overflow:visible}

/* 大饼图（并排） */
.sb-pies{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.sb-piew{display:flex;align-items:center;gap:26px}
.sb-pie{width:158px;height:158px;border-radius:50%;flex-shrink:0;position:relative}
.sb-pie:after{content:'';position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.sb-pie-lg{display:flex;flex-direction:column;gap:13px;flex:1}
.sb-pie-lg .i{display:flex;align-items:center;gap:10px;font-size:13px}
.sb-pie-lg .d{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.sb-pie-lg .nm{flex:1;color:var(--txt2)}
.sb-pie-lg .vv{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.sb-pie-lg .pc{color:var(--txt3);font-size:11.5px;width:44px;text-align:right}

/* 底部两栏 */
.sb-row2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.sb-tbl{width:100%;border-collapse:collapse;font-size:13px}

const SVG_AREA = (c,pts,fill)=>`

/* 双轴趋势图：底部柱状 = 每日新增，上部折线 = 累计用户 */
const SVG_TREND = (c,news,cums,cb,cl)=>{
  const W=700,H=190,n=news.length,step=W/n,bw=step*0.56;
  const maxN=Math.max(...news),maxC=Math.max(...cums),minC=Math.min(...cums);
  const grid=[38,76,114,152].map(y=>`<line x1="0" y1="${y}" x2="700" y2="${y}"/>`).join('');
  const bars=news.map((v,i)=>{
    const h=Math.max(2,v/maxN*58);
    return `<rect x="${(i*step+(step-bw)/2).toFixed(1)}" y="${(H-h-3).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${cb}" opacity=".62"/>`;
  }).join('');
  const line=cums.map((v,i)=>`${(i*step+step/2).toFixed(1)},${(16+(1-(v-minC)/((maxC-minC)||1))*70).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 700 190" preserveAspectRatio="none">
    <defs><linearGradient id="gt${c}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${cl}" stop-opacity=".32"/>

      points="${line}" style="filter:drop-shadow(0 0 6px ${cl})"/>

};

function showBoard(key,syncHash=true){
  key=normalizeBoardKey(key);
  const b=BOARDS.find(x=>x.key===key);
  if(syncHash && location.hash!==`#${key}`){
    history.replaceState(null,'',`#${key}`);

  // 星空：直接进面板，左上角返回
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('panel-'+key).classList.add('on');
  document.getElementById('panel-'+key).style.setProperty('--nc',b.color);
  document.getElementById('backBtn').style.setProperty('--nc',b.color);
  // 经典：内容进右侧
  clsContent.innerHTML=`<div class="board" style="--nc:${b.color}">${HTML[key]}</div>`;

}

/* 星空大屏趋势图：柱状=每日新增，折线=累计用户（比经典版更高，不锁死） */
function renderSbTrend(key){
  const el=document.getElementById('sbTrend');
  if(!el || !TREND_NEW) return;
  const W=700,H=290,n=TREND_NEW.length,step=W/n,bw=step*0.58;
  const maxN=Math.max(...TREND_NEW),maxC=Math.max(...TREND_CUM),minC=Math.min(...TREND_CUM);
  const grid=[58,116,174,232].map(y=>`<line x1="0" y1="${y}" x2="700" y2="${y}"/>`).join('');
  const bars=TREND_NEW.map((v,i)=>{
    const h=Math.max(3,v/maxN*96);
    return `<rect x="${(i*step+(step-bw)/2).toFixed(1)}" y="${(H-h-4).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>`;
  }).join('');
  const line=TREND_CUM.map((v,i)=>`${(i*step+step/2).toFixed(1)},${(24+(1-(v-minC)/(maxC-minC))*122).toFixed(1)}`).join(' ');
  el.innerHTML=`<svg viewBox="0 0 700 290" preserveAspectRatio="none">
    <defs><linearGradient id="sbt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b8cff" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#7b8cff" stop-opacity="0"/></linearGradient></defs>
    <g stroke="rgba(255,255,255,.06)" stroke-width="1">${grid}</g>
    <g fill="#3ddc97" opacity=".72">${bars}</g>
    <polygon fill="url(#sbt)" points="${line} 700,160 0,160"/>
    <polyline fill="none" stroke="#7b8cff" stroke-width="2.6" stroke-linejoin="round"
      points="${line}" style="filter:drop-shadow(0 0 8px #7b8cff)"/>
  </svg>`;
}

/* 数字滚动动画 */
function animateNums(root){
  root.querySelectorAll('[data-num]').forEach(el=>{
    const target=+el.dataset.num, suf=el.dataset.suffix||'';
    if(el.__done===target) return;
    el.__done=target;
    const dur=900, t0=performance.now();
    (function step(t){
      const p=Math.min(1,(t-t0)/dur);
      const e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e).toLocaleString()+suf;
      if(p<1) requestAnimationFrame(step);
    })(t0);
  });
}

  const type=card.querySelector('.online-type')?.value||'';
  const rows=card?.querySelectorAll('.ol .r,.sb-ol .r')||[];
  rows.forEach(row=>{
    const text=row.innerText.toLowerCase();
    const matchKeyword=!kw || text.includes(kw);
    const matchType=!type || row.innerText.includes(type);
    row.style.display=(matchKeyword && matchType)?'flex':'none';
  });
}
document.addEventListener('input',e=>{
  if(e.target.matches('.online-search')) filterOnlineUsers(e.target);
});
document.addEventListener('change',e=>{
  if(e.target.matches('.online-type')) filterOnlineUsers(e.target);
});

window.addEventListener('hashchange',()=>{
  document.getElementById('sf').style.display='none';
  showBoard(getInitialBoardKey());
});

/* 初始：无 hash 展示看板星空入口；有 hash 直接进入对应看板大屏 */
const initialHashBoard=(location.hash||'').replace('#','');
const hasInitialBoardHash=BOARDS.some(b=>b.key===initialHashBoard);
setMode('star');
showBoard(getInitialBoardKey(),hasInitialBoardHash);
if(hasInitialBoardHash){
  document.getElementById('sf').style.display='none';
}else{
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
}
</script>
</body>
</html>
